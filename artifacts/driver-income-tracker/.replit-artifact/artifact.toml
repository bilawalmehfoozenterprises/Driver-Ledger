kind = "mobile"
previewPath = "/"
title = "Driver Income Tracker"
description = "A mobile-only Expo foundation for a Pakistani driver to later track student transport income, occasional bookings, and vehicle expenses such as petrol."
version = "1.0.0"
id = "artifacts/driver-income-tracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 19377

[services.development]
run = "pnpm --filter @workspace/driver-income-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/driver-income-tracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/driver-income-tracker", "run", "serve" ]

[services.env]
PORT = "19377"
BASE_PATH = "/"
